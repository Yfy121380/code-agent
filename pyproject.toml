[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codemate"
version = "0.1.0"
description = "Small local coding agent for Ollama, OpenAI-compatible, Anthropic-compatible, and DeepSeek models"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0",
  "pillow>=10.0.0",
  "prompt_toolkit>=3.0.0",
  "rich>=13.0.0",
]

[project.scripts]
codemate = "codemate.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["codemate*"]
